[config]
model = "openrouter/anthropic/claude-sonnet-5.5"
fallback_models = ["openrouter/openai/gpt-5.4"]
custom_model_max_tokens = 1000000
response_language = "pt-BR"

[pr_reviewer]
extra_instructions = """
Responda em português do Brasil.
Projeto: fábrica de software com TDD obrigatório, guardrails por código e merge exclusivamente humano.
Priorize: correção funcional, perda de trabalho, vazamento de segredos, idempotência e retomada após reinício.
Considere efeitos fora do diff (chamadores e contratos afetados). Não sugira operações de merge automático.
"""

[pr_code_suggestions]
extra_instructions = "Responda em português do Brasil. Sugira apenas mudanças com impacto real; ignore estilo coberto pelo Biome."
