name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-agent:
    # Ignora bots (inclusive a própria fábrica e o CodeRabbit) e comentários fora de PR.
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent (review e improve via OpenRouter)
        # Fixado por SHA: the-pr-agent/pr-agent (MIT), 2026-11-07.
        uses: the-pr-agent/pr-agent@455bd81d8e0ce3af80ef2cfc86df238a5b4b7c90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          # Modelo no env: o .pr_agent.toml do repositório só vale a partir do branch padrão.
          CONFIG.MODEL: "openrouter/google/gemini-3.8-flash"
          CONFIG.FALLBACK_MODELS: '["openrouter/openai/gpt-5-mini"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "400000"
          CONFIG.RESPONSE_LANGUAGE: "pt-BR"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          # Revisa também a cada push no PR (padrão ignora synchronize).
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'
