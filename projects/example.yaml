# Exemplo de config de projeto da Fábrica.
# As configs reais ficam fora do repo, em ~/.config/software-factory/projects/<projeto>.yaml (ADR-0010).

name: exemplo

# Dry-run: lê a Fonte de verdade, mas só registra as escritas (visíveis em GET /events).
# Ligado por padrão; desligue só depois de conferir o comportamento.
dryRun: true

source:
  type: jira
  # Chave do projeto na Fonte.
  project: PROJ
  # Seu identificador na Fonte: a fábrica só trabalha nos cards atribuídos a ele.
  # No Jira, o seu accountId ou o seu e-mail; é com este valor que a fábrica reconhece os próprios comentários.
  assignee: seu-id-no-jira

# Modelo fixado para cada papel (provedor e modelo como o pi-ai os conhece).
# spec: grill, SPEC e Tickets. implementer: implementação com TDD (opcional; sem ele, usa o de spec).
roles:
  spec:
    provider: anthropic
    model: claude-sonnet-4-6
  implementer:
    provider: anthropic
    model: claude-sonnet-4-6

# Prefixo do título/chave ou board do card -> repositório (o primeiro que corresponder vale).
# path é a sua cópia local: a fábrica só lê dela e trabalha num clone próprio ao lado do estado durável
# (<dir do FACTORY_STATE_PATH>/worktrees/<projeto>/<card>), com push para o mesmo remoto origin.
# test.command é o argv do comando de teste, sem shell; o modelo só pode rodá-lo como está.
# Card sem correspondência: a Tarefa fica bloqueada. Sem repositories, a Tarefa termina nos Tickets.
repositories:
  - path: /home/voce/projetos/meu-backend
    prefix: PROJ
    test:
      command: [npm, test]
      timeoutSeconds: 300
      # Opcional: padrões (glob) dos arquivos de teste; o padrão cobre *.test.*, *.spec.*, test/, tests/ etc.
      # files: ["src/**/*.test.ts"]
  - path: /home/voce/projetos/meu-app
    board: Mobile
    test:
      command: [npm, test]

# Sobrescritas das convenções descobertas no histórico (opcional).
# Marcadores: {key} e {slug} na branch; {type}, {summary} e {key} no commit.
# conventions:
#   branch: feature/{key}-{slug}
#   commit: "{type}: {summary} ({key})"

# Nome do status no workflow da Fonte -> estado que a fábrica entende.
# Estados: backlog, todo, in_progress, waiting_test, waiting_validation, gmud, done.
# A fábrica assume cards em todo e in_progress; status fora deste mapa são ignorados.
statuses:
  Backlog: backlog
  A Fazer: todo
  Em Andamento: in_progress
  Aguardando Teste: waiting_test
  Aguardando Validação: waiting_validation
  GMUD: gmud
  Concluído: done
