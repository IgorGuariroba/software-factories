# Exemplo de config de projeto da Fábrica.
# As configs reais ficam fora do repo, em ~/.config/software-factory/projects/<projeto>.yaml (ADR-0010).

name: exemplo

# Dry-run: lê a Fonte de verdade, mas só registra as escritas (visíveis em GET /events).
# Ligado por padrão; desligue só depois de conferir o comportamento.
dryRun: true

source:
  type: jira
  # Chave do projeto na Fonte.
  project: PROJ
  # Seu identificador na Fonte: a fábrica só trabalha nos cards atribuídos a ele.
  # No Jira, o seu accountId ou o seu e-mail; é com este valor que a fábrica reconhece os próprios comentários.
  assignee: seu-id-no-jira

# Modelo fixado para cada papel (provedor e modelo como o pi-ai os conhece).
# spec: grill, SPEC e Tickets.
roles:
  spec:
    provider: anthropic
    model: claude-sonnet-4-6

# Nome do status no workflow da Fonte -> estado que a fábrica entende.
# Estados: backlog, todo, in_progress, waiting_test, waiting_validation, gmud, done.
# A fábrica assume cards em todo e in_progress; status fora deste mapa são ignorados.
statuses:
  Backlog: backlog
  A Fazer: todo
  Em Andamento: in_progress
  Aguardando Teste: waiting_test
  Aguardando Validação: waiting_validation
  GMUD: gmud
  Concluído: done
